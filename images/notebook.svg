<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="nb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="cover-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold-foil" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#nb-bg)"/>
  <!-- Notebook shadow and pages -->
  <g transform="translate(110, 40)" filter="url(#shadow)">
    <!-- Back cover edge -->
    <rect x="6" y="8" width="176" height="216" rx="8" fill="#cbd5e1"/>
    <!-- Page block edges -->
    <rect x="4" y="5" width="176" height="216" rx="8" fill="#f1f5f9"/>
    <line x1="178" y1="10" x2="178" y2="215" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Front Cover -->
    <rect x="0" y="0" width="176" height="216" rx="8" fill="url(#cover-grad)"/>
    <!-- Spine binding -->
    <path d="M0,0 Q10,108 0,216" stroke="#3b82f6" stroke-width="4" fill="none" opacity="0.4"/>
    <!-- Bookmark ribbon -->
    <path d="M110,0 L110,230 L118,222 L126,230 L126,0 Z" fill="#ef4444"/>
    <!-- Elastic closure band -->
    <rect x="144" y="0" width="12" height="216" fill="#0284c7" opacity="0.8"/>
    <!-- Cover design / embossed foil -->
    <rect x="28" y="44" width="80" height="4" rx="2" fill="url(#gold-foil)"/>
    <text x="28" y="80" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="700" font-size="13" letter-spacing="1.5">CAMPUS NOTES</text>
    <text x="28" y="96" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">192 Pages · 100 GSM</text>
    <circle cx="68" cy="140" r="22" fill="none" stroke="url(#gold-foil)" stroke-width="1.5"/>
    <text x="68" y="144" fill="url(#gold-foil)" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" text-anchor="middle">★</text>
  </g>
  <!-- Stylus / Pen beside -->
  <g transform="translate(70, 70) rotate(-18)">
    <rect x="0" y="0" width="8" height="150" rx="4" fill="#0284c7"/>
    <rect x="0" y="10" width="8" height="14" fill="#f59e0b"/>
    <polygon points="0,150 8,150 4,166" fill="#334155"/>
    <polygon points="3,162 5,162 4,168" fill="#0284c7"/>
  </g>
</svg>
