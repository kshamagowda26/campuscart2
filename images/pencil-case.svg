<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="pc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="pouch-canvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <filter id="pc-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="12" stdDeviation="10" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#pc-bg)"/>
  <!-- Pouch Body -->
  <g transform="translate(60, 75)" filter="url(#pc-shadow)">
    <!-- Base shadow cushion -->
    <path d="M20,135 L260,135 Q280,135 280,120 L275,30 Q275,15 255,15 L25,15 Q5,15 5,30 L0,120 Q0,135 20,135 Z" fill="url(#pouch-canvas)"/>
    <!-- Textured canvas grain highlight -->
    <path d="M10,25 Q140,20 270,25" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.4"/>
    <!-- Top Zipper Track -->
    <rect x="25" y="12" width="230" height="8" rx="2" fill="#334155"/>
    <line x1="25" y1="16" x2="255" y2="16" stroke="#94a3b8" stroke-width="2" stroke-dasharray="2,2"/>
    <!-- Zipper Pull Tab -->
    <rect x="210" y="8" width="16" height="12" rx="3" fill="#cbd5e1"/>
    <path d="M218,20 L218,34 L212,38 L224,38 L218,34" fill="#94a3b8"/>
    <!-- Front Pocket with mesh contrast -->
    <rect x="30" y="45" width="220" height="70" rx="8" fill="#0c4a6e" opacity="0.6"/>
    <rect x="30" y="45" width="220" height="70" rx="8" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4"/>
    <!-- Leather patch brand -->
    <rect x="110" y="65" width="60" height="24" rx="4" fill="#d97706"/>
    <rect x="112" y="67" width="56" height="20" rx="3" fill="none" stroke="#b45309" stroke-width="1"/>
    <text x="140" y="80" text-anchor="middle" fill="#fef3c7" font-family="system-ui, sans-serif" font-weight="700" font-size="8" letter-spacing="1">STUDYPRO</text>
    <!-- Pens peeking out of zipper slightly -->
    <g transform="translate(60, -2)">
      <rect x="0" y="0" width="8" height="22" rx="3" fill="#ef4444"/>
      <rect x="15" y="-5" width="8" height="27" rx="3" fill="#10b981"/>
      <rect x="30" y="-2" width="8" height="24" rx="3" fill="#fbbf24"/>
    </g>
    <!-- Carry strap loop on left -->
    <path d="M5,40 C-15,40 -15,80 5,80" stroke="#0369a1" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>
</svg>
