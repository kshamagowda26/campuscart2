<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="usb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="lamp-glow" cx="60%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#fef08a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
    </radialGradient>
    <filter id="light-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#usb-bg)"/>
  <!-- Ambient glow beam -->
  <circle cx="270" cy="90" r="90" fill="url(#lamp-glow)"/>
  <g filter="url(#light-shadow)">
    <!-- USB Plug Connector at bottom-left -->
    <g transform="translate(100, 230) rotate(-20)">
      <!-- USB connector metal plug -->
      <rect x="0" y="0" width="22" height="28" rx="2" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
      <rect x="4" y="6" width="5" height="10" fill="#334155"/>
      <rect x="13" y="6" width="5" height="10" fill="#334155"/>
      <!-- Housing collar -->
      <rect x="-3" y="28" width="28" height="20" rx="4" fill="#0284c7"/>
    </g>
    <!-- Flexible Silicone Gooseneck Arm with graceful arc -->
    <path d="M120,240 C120,160 210,210 230,130" stroke="#0284c7" stroke-width="18" fill="none" stroke-linecap="round"/>
    <path d="M120,240 C120,160 210,210 230,130" stroke="#38bdf8" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.4"/>
    <!-- LED Light Head Lamp Bar -->
    <g transform="translate(200, 70) rotate(25)">
      <!-- Lamp back casing -->
      <rect x="0" y="0" width="110" height="34" rx="17" fill="#0369a1"/>
      <!-- Diffuser panel -->
      <rect x="6" y="5" width="98" height="24" rx="12" fill="#fef08a"/>
      <!-- Individual bright LED diodes -->
      <circle cx="22" cy="17" r="4" fill="#ffffff"/>
      <circle cx="38" cy="17" r="4" fill="#ffffff"/>
      <circle cx="54" cy="17" r="4" fill="#ffffff"/>
      <circle cx="70" cy="17" r="4" fill="#ffffff"/>
      <circle cx="86" cy="17" r="4" fill="#ffffff"/>
      <!-- Touch switch sensor icon on tip -->
      <circle cx="5" cy="17" r="2.5" fill="#38bdf8"/>
    </g>
  </g>
  <!-- Text Label -->
  <text x="200" y="278" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" letter-spacing="1">FLEXIBLE USB EYE-CARE READING LIGHT</text>
</svg>
