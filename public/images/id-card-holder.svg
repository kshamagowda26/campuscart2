<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="id-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="lanyard-ribbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <filter id="id-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="10" stdDeviation="8" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#id-bg)"/>
  <!-- Lanyard Neck Straps coming down -->
  <path d="M160,-20 Q180,80 195,110" stroke="url(#lanyard-ribbon)" stroke-width="16" fill="none" stroke-linecap="round"/>
  <path d="M240,-20 Q220,80 205,110" stroke="url(#lanyard-ribbon)" stroke-width="16" fill="none" stroke-linecap="round"/>
  <!-- Metal Swivel Lobster Clasp & Ring -->
  <circle cx="200" cy="118" r="8" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
  <rect x="195" y="126" width="10" height="15" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
  <path d="M197,141 L203,141 L205,152 L195,152 Z" fill="#64748b"/>
  <!-- ID Badge Holder -->
  <g transform="translate(130, 150)" filter="url(#id-shadow)">
    <!-- Outer Premium Leatherette Case -->
    <rect x="0" y="0" width="140" height="125" rx="10" fill="#1e293b"/>
    <!-- Top Slot for Clip -->
    <rect x="52" y="6" width="36" height="6" rx="3" fill="#0f172a"/>
    <!-- Inner Clear Window Border -->
    <rect x="12" y="20" width="116" height="92" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <!-- ID Card Simulation -->
    <!-- Campus Banner -->
    <rect x="14" y="22" width="112" height="24" rx="4" fill="#2563eb"/>
    <text x="70" y="37" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="8" letter-spacing="0.5">NATIONAL UNIVERSITY</text>
    <!-- Photo Box -->
    <rect x="22" y="52" width="28" height="34" rx="3" fill="#e2e8f0"/>
    <circle cx="36" cy="63" r="6" fill="#94a3b8"/>
    <path d="M26,82 C26,73 46,73 46,82 Z" fill="#94a3b8"/>
    <!-- Text Lines -->
    <text x="56" y="60" fill="#0f172a" font-family="system-ui, sans-serif" font-weight="700" font-size="8">STUDENT PASS</text>
    <text x="56" y="70" fill="#64748b" font-family="system-ui, sans-serif" font-size="7">ID: 2026-ENG-491</text>
    <text x="56" y="80" fill="#16a34a" font-family="system-ui, sans-serif" font-weight="600" font-size="7">ACTIVE · VALID</text>
    <!-- Barcode simulation -->
    <line x1="22" y1="98" x2="118" y2="98" stroke="#0f172a" stroke-width="4" stroke-dasharray="3,1,1,2,4,2,1,3,2,1"/>
  </g>
</svg>
