<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="org-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="mesh-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="org-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="16" stdDeviation="12" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#org-bg)"/>
  <!-- Shadow on table -->
  <ellipse cx="200" cy="265" rx="140" ry="18" fill="#94a3b8" opacity="0.4"/>
  <g transform="translate(60, 45)" filter="url(#org-shadow)">
    <!-- Back tier: Notebook / Folder holder -->
    <rect x="20" y="20" width="240" height="80" rx="8" fill="#1e293b"/>
    <!-- Folders sticking up in back slot -->
    <rect x="35" y="0" width="65" height="50" rx="4" fill="#0284c7"/>
    <rect x="110" y="-10" width="70" height="60" rx="4" fill="#10b981"/>
    <rect x="190" y="5" width="55" height="45" rx="4" fill="#f59e0b"/>
    <!-- Middle tier: Pen and Tool Cups -->
    <!-- Left Pen Cup -->
    <rect x="25" y="80" width="70" height="110" rx="6" fill="#334155"/>
    <rect x="30" y="85" width="60" height="100" rx="4" fill="#0f172a"/>
    <!-- Pens sticking up -->
    <line x1="45" y1="90" x2="40" y2="40" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
    <line x1="60" y1="90" x2="60" y2="35" stroke="#3b82f6" stroke-width="7" stroke-linecap="round"/>
    <line x1="75" y1="90" x2="80" y2="45" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
    <!-- Pair of Scissors -->
    <line x1="50" y1="65" x2="70" y2="30" stroke="#cbd5e1" stroke-width="4"/>
    <circle cx="73" cy="27" r="6" stroke="#f43f5e" stroke-width="3" fill="none"/>
    <!-- Middle Tray for Memo Pad & Phone -->
    <rect x="105" y="90" width="80" height="100" rx="6" fill="#334155"/>
    <rect x="110" y="95" width="70" height="90" rx="4" fill="#0f172a"/>
    <!-- Sticky memo stack -->
    <rect x="118" y="125" width="54" height="54" rx="4" fill="#fef08a"/>
    <!-- Right Cup for Ruler & Markers -->
    <rect x="195" y="80" width="70" height="110" rx="6" fill="#334155"/>
    <rect x="200" y="85" width="60" height="100" rx="4" fill="#0f172a"/>
    <!-- Wooden Ruler -->
    <polygon points="215,90 227,90 222,25 210,25" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
    <!-- Highlighters -->
    <rect x="235" y="45" width="12" height="45" rx="3" fill="#ec4899"/>
    <!-- Front Drawer / Flat tray section -->
    <rect x="15" y="180" width="250" height="40" rx="8" fill="#1e293b"/>
    <rect x="25" y="186" width="230" height="28" rx="4" fill="#0f172a"/>
    <!-- Drawer pull handle -->
    <rect x="120" y="196" width="40" height="8" rx="4" fill="#64748b"/>
    <!-- Metallic mesh pattern lines -->
    <line x1="30" y1="100" x2="85" y2="100" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="30" y1="130" x2="85" y2="130" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="30" y1="160" x2="85" y2="160" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>
  </g>
</svg>
